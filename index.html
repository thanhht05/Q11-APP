<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium MP3 Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="player-card">
            <div class="player-header">
                <h2>MP3 PLAYER</h2>
                <div class="file-input-wrapper">
                    <button class="btn file-btn" id="fileBtn"><i class="fas fa-folder-open"></i> Open</button>
                    <input type="file" id="fileInput" accept="audio/mp3, audio/mpeg" multiple>
                </div>
            </div>

            <div class="song-info">
                <h3 id="songTitle">No song selected</h3>
            </div>

            <div class="progress-container">
                <div class="time-display">
                    <span id="currentTime">00:00</span>
                    <span id="durationTime">00:00</span>
                </div>
                <input type="range" id="progressBar" class="slider" value="0" min="0" max="100" step="0.1">
            </div>

            <div class="controls-container">
                <button class="btn control-btn secondary-btn" id="repeatBtn" title="Repeat All">
                    <i class="fas fa-repeat"></i>
                </button>
                <button class="btn control-btn" id="prevBtn" title="Previous">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="btn control-btn play-btn" id="playPauseBtn" title="Play">
                    <i class="fas fa-play"></i>
                </button>
                <button class="btn control-btn" id="nextBtn" title="Next">
                    <i class="fas fa-step-forward"></i>
                </button>
                <button class="btn control-btn secondary-btn" id="shuffleBtn" title="Shuffle">
                    <i class="fas fa-random"></i>
                </button>
            </div>

            <div class="volume-container">
                <button class="btn volume-btn" id="muteBtn" title="Mute">
                    <i class="fas fa-volume-up"></i>
                </button>
                <input type="range" id="volumeBar" class="slider volume-slider" value="100" min="0" max="100">
            </div>
        </div>

        <div class="playlist-card">
            <h3>Playlist <span class="badge" id="playlistCount">0</span></h3>
            <ul id="playlist" class="playlist-list">
                <li class="empty-state">No files selected. Click 'Open' to add MP3 files.</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
